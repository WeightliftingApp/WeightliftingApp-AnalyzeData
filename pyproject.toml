[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weightlifting-app-analysis"
version = "0.1.0"
description = "Tested Python and notebook analyses of Weightlifting App exports"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "matplotlib",
    "numpy",
    "openpyxl",
    "pandas>=2.0",
]

[project.optional-dependencies]
notebooks = [
    "joypy",
    "jupyter",
    "scipy",
    "seaborn",
    "tqdm",
]
dev = [
    "Pillow",
    "pytest>=8",
]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["analysis_utils", "training_dataset"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
